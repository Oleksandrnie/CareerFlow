[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careerflow"
version = "0.1.0"
description = "Local-first workspace for managing a job search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "pypdf>=5,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["careerflow*"]

[tool.setuptools.package-data]
careerflow = ["static/*"]


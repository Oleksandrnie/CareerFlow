[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careerflow"
version = "0.1.0"
description = "Local-first workspace for managing a job search"
readme = "README.md"
license = "MIT"
authors = [{ name = "Oleksandr Niemchenko" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "pypdf>=5,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9,<2",
  "build>=1.3,<2",
  "detect-secrets>=1.5,<2",
  "httpx>=0.27,<1",
  "pip-audit>=2.10,<3",
  "pip>=26.1,<27",
  "ruff>=0.17,<1",
  "setuptools>=68,<85",
  "wheel>=0.45,<1",
]

[tool.setuptools.packages.find]
include = ["careerflow*"]

[tool.setuptools.package-data]
careerflow = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

